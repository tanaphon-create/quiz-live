<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ฟลุ๊กถูก</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .wrap { min-height: 100dvh; display: grid; place-content: center; gap: 28px; padding: 24px 16px; text-align: center; }
  .logo { justify-content: center; font-size: 2.8rem; } .logo .mark { width: 60px; height: 60px; }
  .tag { margin: -12px 0 0; opacity: .8; font-size: 1.1rem; }
  .pick { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; width: min(640px, calc(100vw - 32px)); }
  .pick a { text-decoration: none; padding: 26px 20px; display: grid; gap: 8px; justify-items: center; transition: transform .15s; }
  .pick a:hover { transform: translateY(-4px); }
  .pick .ico { font-size: 3rem; } .pick h2 { margin: 0; } .pick p { margin: 0; color: var(--ink2); font-size: .95rem; }
</style>
</head>
<body class="sky">
  <div class="wrap">
    <div class="logo"><span class="mark"></span>ฟลุ๊ก<b>ถูก</b></div>
    <p class="tag">ตอบคำถามแข่งกันแบบเรียลไทม์ในห้องเรียน</p>
    <div class="pick">
      <a class="card" href="host.html"><span class="ico">🧑‍🏫</span><h2>ครู</h2><p>สร้างคำถาม เปิดห้อง ฉายขึ้นจอ</p></a>
      <a class="card" href="play.html"><span class="ico">🎒</span><h2>นักเรียน</h2><p>ใส่ PIN แต่งตัว แล้วรอในห้องล็อกเกอร์</p></a>
    </div>
  </div>
</body>
</html>
